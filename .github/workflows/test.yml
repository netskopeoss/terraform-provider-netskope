name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches:
      - main

jobs:
  # Secret scanning runs on every push and PR to catch leaked credentials early.
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run gitleaks
        run: gitleaks detect --source . --log-opts "origin/main..HEAD" --verbose

  # Unit tests run on every push and PR
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v ./... -timeout 10m

  # Acceptance tests run on PRs to main and on pushes to main/release branches.
  # Secrets are available to PRs from this repo only (not forks), so the condition
  # excludes fork PRs to avoid exposing credentials to untrusted code.
  acceptance:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: unit
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1"
          terraform_wrapper: false

      - name: Download dependencies
        run: go mod download

      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          NETSKOPE_API_KEY: ${{ secrets.NETSKOPE_API_KEY }}
          NETSKOPE_SERVER_URL: ${{ secrets.NETSKOPE_SERVER_URL }}
          NETSKOPE_OAUTH2_CLIENT_ID: ${{ secrets.NETSKOPE_OAUTH2_CLIENT_ID }}
          NETSKOPE_OAUTH2_CLIENT_SECRET: ${{ secrets.NETSKOPE_OAUTH2_CLIENT_SECRET }}
          NETSKOPE_TEST_USER: ${{ secrets.NETSKOPE_TEST_USER }}
          TF_RUN_DESTINATION_PROFILES: ${{ secrets.TF_RUN_DESTINATION_PROFILES }}
        run: go test -v ./internal/provider/... -timeout 120m -parallel 8
